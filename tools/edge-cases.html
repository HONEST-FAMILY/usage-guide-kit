<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>어니스트 투어 — 까다로운 경우 시험</title>
<link rel="stylesheet" href="../hf-tour.css">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f6f8fc; }
  header { position: sticky; top: 0; height: 64px; background: #111a2e; color: #fff; display: flex; align-items: center; padding: 0 16px; z-index: 5; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  .tall { height: 1400px; background: linear-gradient(#e8eefc, #fff); border: 1px solid #cdd8f3; border-radius: 12px; padding: 16px; }
  .box { margin: 24px 0; padding: 16px; background: #fff; border: 1px solid #dde3ef; border-radius: 12px; }
  .scroller { height: 160px; overflow: auto; border: 1px solid #dde3ef; border-radius: 12px; background: #fff; }
  .scroller > div { height: 900px; position: relative; }
  #deep { position: absolute; top: 760px; left: 20px; padding: 8px 12px; background: #2f6bff; color: #fff; border-radius: 8px; }
  #last { display: inline-block; padding: 10px 16px; background: #111; color: #fff; border-radius: 10px; }
  button { font: inherit; }
</style>
</head>
<body>
<header>고정 머리줄(64px)</header>
<main>
  <button id="start" type="button">시작</button>
  <div class="box" id="small">작은 대상</div>
  <div class="tall" id="tall">화면보다 큰 대상(1400px)</div>
  <div class="box">
    <div class="scroller"><div><span id="deep">스크롤 상자 깊은 곳</span></div></div>
  </div>
  <div class="box" id="late-holder">나중에 생기는 대상 자리</div>
  <div style="height: 40px"></div>
  <span id="last">맨 아래 단추</span>
</main>
<script src="../hf-tour.js"></script>
<script>
  setTimeout(function () {
    var n = document.createElement('span');
    n.id = 'late';
    n.textContent = '0.6초 뒤에 생긴 대상';
    document.getElementById('late-holder').appendChild(n);
  }, 600);
  var tour = HFTour.create({
    scrollOffset: 64,
    steps: [
      { target: '#small', title: '작은 대상', description: '고정 머리줄에 가리지 않아야 합니다.' },
      { target: '#tall', title: '화면보다 큰 대상', description: '설명창은 화면 안에 있어야 합니다.' },
      { target: '#deep', title: '스크롤 상자 안', description: '상자 안을 스크롤해서 보여 줘야 합니다.' },
      { target: '#late', title: '늦게 생긴 대상', description: '기다렸다가 찾아야 합니다.' },
      { target: '#nothing-here', title: '없는 대상', description: '가운데 창으로 보여야 합니다.' },
      { target: '#last', title: '맨 아래 단추', description: '더 내릴 수 없어도 가리지 않아야 합니다.' }
    ]
  });
  document.getElementById('start').addEventListener('click', function () { tour.start(0); });
</script>
</body>
</html>
